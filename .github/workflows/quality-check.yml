name: Analytics project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run sales analysis
        run: python scripts/run_analysis.py
      - name: Test sales analysis
        run: python -m unittest discover -s tests -v
      - name: Run customer churn analysis
        run: python projects/customer-churn-prediction/scripts/run_analysis.py
      - name: Test customer churn analysis
        run: python -m unittest discover -s projects/customer-churn-prediction/tests -v
      - name: Upload generated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-project-output
          path: |
            outputs/
            reports/
            projects/customer-churn-prediction/outputs/
          if-no-files-found: warn
