<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc"><title id="title">Sales analysis workflow</title><desc id="desc">CSV validation, metric calculation, aggregation and SQLite storage, followed by charts and dashboards.</desc><rect width="1000" height="230" rx="16" fill="#f7f8fa"/><g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1f2937"><g><rect x="25" y="70" width="165" height="90" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="107" y="105" font-size="17" font-weight="700">Source data</text><text x="107" y="130" font-size="13">CSV order lines</text></g><g><rect x="220" y="70" width="165" height="90" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="302" y="105" font-size="17" font-weight="700">Validate</text><text x="302" y="130" font-size="13">Types and ranges</text></g><g><rect x="415" y="70" width="165" height="90" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="497" y="105" font-size="17" font-weight="700">Transform</text><text x="497" y="130" font-size="13">Revenue and profit</text></g><g><rect x="610" y="70" width="165" height="90" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="692" y="105" font-size="17" font-weight="700">Summarise</text><text x="692" y="130" font-size="13">SQL and SQLite</text></g><g><rect x="805" y="70" width="165" height="90" rx="12" fill="#e8f2ff" stroke="#2563eb" stroke-width="2"/><text x="887" y="105" font-size="17" font-weight="700">Communicate</text><text x="887" y="130" font-size="13">Charts and BI</text></g><g stroke="#64748b" stroke-width="2.5" fill="none"><path d="M190 115 H214 l-8 -6 m8 6 l-8 6"/><path d="M385 115 H409 l-8 -6 m8 6 l-8 6"/><path d="M580 115 H604 l-8 -6 m8 6 l-8 6"/><path d="M775 115 H799 l-8 -6 m8 6 l-8 6"/></g><text x="500" y="35" font-size="19" font-weight="700">From order records to decision-ready summaries</text></g></svg>